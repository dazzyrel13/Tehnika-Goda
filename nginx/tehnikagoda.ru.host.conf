# Host nginx site for Timeweb VPS (proxies to Docker web on 127.0.0.1:8000).
# Also install http{} snippet: nginx/tehnikagoda.http.conf → /etc/nginx/conf.d/
#
# Install:
#   sudo cp nginx/tehnikagoda.http.conf /etc/nginx/conf.d/tehnikagoda.http.conf
#   sudo cp nginx/tehnikagoda.ru.host.conf /etc/nginx/sites-available/tehnikagoda.ru
#   sudo ln -sf /etc/nginx/sites-available/tehnikagoda.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL: certbot --nginx -d tehnikagoda.ru -d www.tehnikagoda.ru
# (certbot will add/adjust the 443 server; keep the location blocks below.)

upstream tehnikagoda_gunicorn {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name tehnikagoda.ru www.tehnikagoda.ru;
    client_max_body_size 150M;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tehnikagoda.ru www.tehnikagoda.ru;
    client_max_body_size 150M;
    server_tokens off;

    # Adjust if certbot used different paths on this VPS.
    ssl_certificate /etc/letsencrypt/live/tehnikagoda.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tehnikagoda.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz/ {
        access_log off;
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /leads/ {
        limit_req zone=tg_form burst=5 nodelay;
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 180s;
    }

    location /catalog/search-ajax/ {
        limit_req zone=tg_search burst=20 nodelay;
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 180s;
    }

    # 2FA login under /{ADMIN_URL_PREFIX}account/login/
    location ~* ^/.+/account/login/?$ {
        limit_req zone=tg_login burst=3 nodelay;
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 180s;
    }

    location /media/ {
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://tehnikagoda_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 180s;
    }
}

# Host nginx config for Timeweb VPS (proxies to Docker web on 127.0.0.1:8000).
# Install: copy to /etc/nginx/sites-available/tehnikagoda.ru and enable.
# Then: certbot --nginx -d tehnikagoda.ru -d www.tehnikagoda.ru

server {
    listen 80;
    listen [::]:80;
    server_name tehnikagoda.ru www.tehnikagoda.ru;
    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

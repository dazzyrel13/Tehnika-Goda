# Compression (file is included from http {}). Brotli needs ngx_brotli — not in stock nginx.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml
    application/rss+xml
    application/atom+xml
    application/manifest+json;

# Rate limits (this file is included from http context, e.g. conf.d/).
limit_req_zone $binary_remote_addr zone=tg_form:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tg_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tg_login:10m rate=5r/m;

# Resolver = Docker embedded DNS so `web` is re-resolved after container recreate (avoids stale IP -> 502).
resolver 127.0.0.11 valid=10s ipv6=off;

# Unknown Host on port 80 must not 301 to an attacker-controlled location.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name tehnikagoda.ru www.tehnikagoda.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tehnikagoda.ru www.tehnikagoda.ru;
    client_max_body_size 150M;
    server_tokens off;

    # SSL certificates from Let's Encrypt (mounted read-only from host /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/tehnikagoda.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tehnikagoda.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP is set by Django SecurityHeadersMiddleware — avoid duplicate headers.

    # Ignore favicon requests if not present
    location = /favicon.ico { access_log off; log_not_found off; }

    # Load balancer / Docker health probe (no rate limit, no access log)
    location = /healthz/ {
        access_log off;
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    
    # Route requests for static files
    location /static/ {
        alias /usr/src/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Nested PDF rule avoids regex+alias path traversal on /media/*.pdf
    location /media/ {
        alias /usr/src/app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location ~* \.pdf$ {
            types { application/pdf pdf; }
            default_type application/pdf;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            expires 7d;
        }
    }

    location /leads/ {
        limit_req zone=tg_form burst=5 nodelay;
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /catalog/search-ajax/ {
        limit_req zone=tg_search burst=20 nodelay;
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 2FA login under /{ADMIN_URL_PREFIX}account/login/ (prefix is env-specific).
    location ~* ^/.+/account/login/?$ {
        limit_req zone=tg_login burst=3 nodelay;
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Proxy to Gunicorn — variable + resolver so backend IP updates when `web` is recreated
    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        # X-Real-IP is authoritative for Django (not client-spoofable via XFF alone)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}


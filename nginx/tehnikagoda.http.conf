# Host nginx http{} snippet for Timeweb VPS.
# Install: copy to /etc/nginx/conf.d/tehnikagoda.http.conf
# Then: nginx -t && systemctl reload nginx
#
# Pair with sites-available config: nginx/tehnikagoda.ru.host.conf

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml
    application/rss+xml
    application/atom+xml
    application/manifest+json;

limit_req_zone $binary_remote_addr zone=tg_form:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tg_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tg_login:10m rate=5r/m;

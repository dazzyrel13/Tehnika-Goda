services:
  db:
    image: dockerhub.timeweb.cloud/library/postgres:15-alpine
    container_name: tehnikagoda_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tehnikagoda_db}
      POSTGRES_USER: ${POSTGRES_USER:-tehnikagoda_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.production.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: dockerhub.timeweb.cloud/library/redis:alpine
    container_name: tehnikagoda_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    restart: always

  web:
    build: .
    container_name: tehnikagoda_web
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - ./logs:/usr/src/app/logs
    env_file:
      - .env
    environment:
      - "DATABASE_URL=postgres://${POSTGRES_USER:-tehnikagoda_prod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tehnikagoda_db}"
      - "REDIS_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0"
      - "REDIS_CACHE_URL=redis://:${REDIS_PASSWORD}@redis:6379/1"
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - BEHIND_HTTPS_PROXY=True
      - TRUST_PROXY_HEADERS=True
    depends_on:
      - db
      - redis
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  celery_worker:
    build: .
    container_name: tehnikagoda_celery_worker
    command: celery -A core worker -l INFO
    volumes:
      - media_volume:/usr/src/app/media
      - static_volume:/usr/src/app/staticfiles
      - ./logs:/usr/src/app/logs
    env_file:
      - .env
    environment:
      - "DATABASE_URL=postgres://${POSTGRES_USER:-tehnikagoda_prod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tehnikagoda_db}"
      - "REDIS_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0"
      - "REDIS_CACHE_URL=redis://:${REDIS_PASSWORD}@redis:6379/1"
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
      - BEHIND_HTTPS_PROXY=True
      - TRUST_PROXY_HEADERS=True
    depends_on:
      - db
      - redis
      - web
    restart: always

  celery_beat:
    build: .
    container_name: tehnikagoda_celery_beat
    command: celery -A core beat -l INFO
    volumes:
      - ./logs:/usr/src/app/logs
    env_file:
      - .env
    environment:
      - "DATABASE_URL=postgres://${POSTGRES_USER:-tehnikagoda_prod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tehnikagoda_db}"
      - "REDIS_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0"
      - "REDIS_CACHE_URL=redis://:${REDIS_PASSWORD}@redis:6379/1"
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
    depends_on:
      - db
      - redis
      - web
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys; ok=False\nfor p in pathlib.Path('/proc').glob('*/cmdline'):\n    try:\n        data=p.read_bytes()\n    except Exception:\n        continue\n    if b'celery' in data and b'beat' in data:\n        ok=True\n        break\nsys.exit(0 if ok else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  postgres_data:
  static_volume:
  media_volume:

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сессия устарела</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; color: #1a1a1a; }
        a { color: #0b57d0; }
    </style>
</head>
<body>
    <h1>Сессия устарела</h1>
    <p>Страница была открыта слишком долго, или браузер не отправил защитный токен.</p>
    <p><strong>Что сделать:</strong> обновите страницу (F5) и повторите вход или сохранение.</p>
    <p>Если сохраняете авто с фото — загружайте пачками по 10–15 снимков и не жмите «Сохранить» повторно с той же пачкой в поле файлов.</p>
</body>
</html>
